<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sailing Progress Tracker{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #172b3a;
      background: #eef3f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    body {
      max-width: 1680px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
    }

    header {
      background: white;
      margin-bottom: 0.65rem;
      border-radius: 14px;
      padding: 0.85rem 1rem;
      box-shadow: 0 8px 24px rgba(18, 59, 80, 0.08);
    }

    main {
      padding: 0;
      background: transparent;
    }

    section {
      margin-bottom: 0.65rem;
      border: 1px solid #dfe8eb;
      border-radius: 14px;
      padding: 0.85rem 1rem;
      background: white;
      box-shadow: 0 5px 18px rgba(18, 59, 80, 0.05);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      background: #123b50;
      color: white;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    header h1,
    header p,
    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    header h1 {
      margin-bottom: 0.2rem;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }

    header p {
      margin-bottom: 0;
      color: #d7e8ec;
    }

    .view-switcher {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin: 0;
    }

    .view-switcher label {
      margin: 0;
      color: #d7e8ec;
    }

    .view-switcher select {
      min-height: 2.2rem;
      min-width: 180px;
      padding: 0.3rem 0.5rem;
      color: #172b3a;
      background: white;
    }

    h2 {
      margin-bottom: 0.4rem;
      font-size: 1.55rem;
      letter-spacing: -0.025em;
    }

    h3 {
      margin-bottom: 0.8rem;
      font-size: 1.08rem;
    }

    a {
      color: #176b73;
    }

    form {
      margin: 0.6rem 0;
    }

    input[type="text"],
    textarea,
    select {
      box-sizing: border-box;
      max-width: 100%;
      min-height: 2.6rem;
      padding: 0.6rem;
      border: 1px solid #aebdc5;
      border-radius: 5px;
      background: white;
      color: inherit;
      font: inherit;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: 3px solid rgba(23, 107, 115, 0.16);
      border-color: #176b73;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
    }

    button {
      min-height: 2.55rem;
      padding: 0.55rem 0.85rem;
      border: 0;
      border-radius: 5px;
      color: white;
      background: #176b73;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover {
      background: #10545b;
      transform: translateY(-1px);
    }

    label {
      display: block;
      margin-bottom: 0.25rem;
      color: #334c59;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .course-form {
      display: grid;
      grid-template-columns: minmax(200px, 2fr) minmax(170px, 1fr) auto;
      align-items: end;
      gap: 0.75rem;
    }

    .course-form input,
    .course-form select {
      width: 100%;
    }

    .course-form button {
      white-space: nowrap;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.8rem;
    }

    .course-card {
      display: block;
      padding: 0.8rem;
      border: 1px solid #dce6e8;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      background: white;
      box-shadow: 0 3px 12px rgba(18, 59, 80, 0.04);
      transition: border-color 120ms ease, box-shadow 120ms ease,
        transform 120ms ease;
    }

    .course-card:hover {
      border-color: #176b73;
      box-shadow: 0 7px 18px rgba(18, 59, 80, 0.11);
      transform: translateY(-2px);
    }

    .course-card-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .course-card h3 {
      margin: 0.3rem 0 0.6rem;
      font-size: 1.15rem;
    }

    .stage-label {
      color: #176b73;
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .availability-warning {
      margin-top: 0.65rem;
      color: #8a4b11;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .muted {
      color: #536873;
      font-size: 0.9rem;
    }

    .flash {
      padding: 0.7rem;
      border-radius: 8px;
      margin: 0.5rem 0;
      background: #e4f4ef;
    }

    .flash.error {
      background: #fbe9e6;
    }

    .progress-track {
      height: 0.55rem;
      margin: 0.5rem 0;
      overflow: hidden;
      border-radius: 5px;
      background: #e8edef;
    }

    .progress-fill {
      height: 100%;
      background: #176b73;
    }

    .progress-grid-wrap {
      max-height: 72vh;
      overflow: auto;
    }

    .progress-grid {
      width: 100%;
      min-width: max(100%, 900px);
      border-spacing: 0;
      border-collapse: separate;
      table-layout: fixed;
    }

    .progress-grid th,
    .progress-grid td {
      padding: 0.4rem 0.55rem;
      border-bottom: 1px solid #e6edef;
    }

    .progress-grid thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      height: 6.5rem;
      background: white;
      text-align: center;
      vertical-align: top;
    }

    .progress-grid .grid-skill-heading,
    .progress-grid .grid-skill {
      position: sticky;
      left: 0;
      z-index: 4;
      width: 34%;
      min-width: 0;
      background: white;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .progress-grid thead .grid-skill-heading {
      z-index: 7;
    }

    .grid-bulk-heading,
    .grid-bulk-cell {
      position: sticky;
      left: 34%;
      z-index: 3;
      width: 8rem;
      min-width: 8rem;
      background: white;
      text-align: center;
    }

    .progress-grid thead .grid-bulk-heading {
      z-index: 6;
    }

    .grid-pupil-heading,
    .grid-check-cell {
      min-width: 0;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .grid-pupil-heading a {
      display: block;
      margin-bottom: 0.2rem;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grid-pupil-heading.selected {
      background: #e4f4ef;
    }

    .grid-section th {
      padding-top: 0.8rem;
      padding-bottom: 0.45rem;
      background: #e8f0f1;
      color: #123b50;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .grid-category th {
      position: sticky;
      top: var(--grid-header-height, 6.5rem);
      z-index: 2;
      background: #f5f8f8;
      color: #334c59;
      text-align: left;
    }

    .grid-category-toggle summary {
      padding: 0.65rem 0.75rem;
      cursor: pointer;
      font-weight: 700;
      list-style-position: inside;
    }

    .grid-bulk-form,
    .grid-cell-form {
      display: flex;
      justify-content: center;
      margin: 0;
    }

    .grid-bulk-form button {
      min-height: 2.1rem;
      padding: 0.35rem 0.55rem;
      font-size: 0.82rem;
      white-space: normal;
      line-height: 1.2;
    }

    .progress-section {
      padding: 0.75rem 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .grid-cell-form label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      cursor: pointer;
    }

    .grid-cell-form input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      margin: 0;
      accent-color: #176b73;
      cursor: pointer;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .note {
      border-left: 3px solid #8eafb2;
      padding: 0.4rem 0.7rem;
      margin: 0.7rem 0;
      background: #f5f8f8;
    }

    .warning-panel {
      border-color: #efd6b6;
      background: #fffaf3;
    }

    .warning-panel p:last-child {
      margin-bottom: 0;
    }

    .danger-button {
      background: #a33131;
    }

    .danger-button:hover {
      background: #812626;
    }

    .danger-zone {
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid #ead6d6;
    }

    @media (max-width: 700px) {
      body {
        padding: 0.75rem;
      }

      header {
        padding: 1rem;
      }

      section {
        padding: 1rem;
      }

      .course-form {
        grid-template-columns: 1fr;
      }

      input[type="text"],
      select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1><a href="{{ url_for('index') }}">Sailing Progress Tracker</a></h1>
    <p>Track course groups and sailors against the sailing syllabus.</p>
    <form class="view-switcher" method="post" action="{{ url_for('change_view') }}">
      <label for="view">View</label>
      <select id="view" name="view" onchange="this.form.submit()">
        <option value="office" {% if current_view == 'office' %}selected{% endif %}>Office</option>
        {% for instructor in view_instructors %}
        <option value="instructor:{{ instructor.id }}" {% if current_view == 'instructor' and current_actor_id == instructor.id %}selected{% endif %}>Instructor · {{ instructor.name }}</option>
        {% endfor %}
        {% for pupil in view_pupils %}
        <option value="pupil:{{ pupil.id }}" {% if current_view == 'pupil' and current_actor_id == pupil.id %}selected{% endif %}>Pupil · {{ pupil.name }}</option>
        {% endfor %}
      </select>
    </form>
  </header>

  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ category }}" role="status">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</body>

</html>
