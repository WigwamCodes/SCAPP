<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sailing Progress Tracker{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #172b3a;
      background: #eef3f4;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    body {
      max-width: 1160px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    header {
      background: white;
      margin-bottom: 1rem;
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 8px 24px rgba(18, 59, 80, 0.08);
    }

    main {
      padding: 0;
      background: transparent;
    }

    section {
      margin-bottom: 1rem;
      border: 1px solid #dfe8eb;
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      background: white;
      box-shadow: 0 5px 18px rgba(18, 59, 80, 0.05);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      background: #123b50;
      color: white;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    header h1,
    header p,
    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    header h1 {
      margin-bottom: 0.2rem;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
    }

    header p {
      margin-bottom: 0;
      color: #d7e8ec;
    }

    h2 {
      margin-bottom: 0.4rem;
      font-size: 1.55rem;
      letter-spacing: -0.025em;
    }

    h3 {
      margin-bottom: 0.8rem;
      font-size: 1.08rem;
    }

    a {
      color: #176b73;
    }

    form {
      margin: 0.6rem 0;
    }

    input[type="text"],
    textarea,
    select {
      box-sizing: border-box;
      max-width: 100%;
      min-height: 2.6rem;
      padding: 0.6rem;
      border: 1px solid #aebdc5;
      border-radius: 5px;
      background: white;
      color: inherit;
      font: inherit;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: 3px solid rgba(23, 107, 115, 0.16);
      border-color: #176b73;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
    }

    button {
      min-height: 2.55rem;
      padding: 0.55rem 0.85rem;
      border: 0;
      border-radius: 5px;
      color: white;
      background: #176b73;
      cursor: pointer;
      font: inherit;
      font-weight: 650;
      transition: background 120ms ease, transform 120ms ease;
    }

    button:hover {
      background: #10545b;
      transform: translateY(-1px);
    }

    label {
      display: block;
      margin-bottom: 0.25rem;
      color: #334c59;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .course-form {
      display: grid;
      grid-template-columns: minmax(200px, 2fr) minmax(170px, 1fr) auto;
      align-items: end;
      gap: 0.75rem;
    }

    .course-form input,
    .course-form select {
      width: 100%;
    }

    .course-form button {
      white-space: nowrap;
    }

    .course-grid,
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 0.8rem;
    }

    .course-card,
    .sailor-card {
      display: block;
      padding: 1.1rem;
      border: 1px solid #dce6e8;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      background: white;
      box-shadow: 0 3px 12px rgba(18, 59, 80, 0.04);
      transition: border-color 120ms ease, box-shadow 120ms ease,
        transform 120ms ease;
    }

    .course-card:hover,
    .sailor-card:hover,
    .sailor-card.active {
      border-color: #176b73;
      box-shadow: 0 7px 18px rgba(18, 59, 80, 0.11);
      transform: translateY(-2px);
    }

    .course-card h3 {
      margin: 0.3rem 0 0.6rem;
      font-size: 1.15rem;
    }

    .stage-label {
      color: #176b73;
      font-size: 0.76rem;
      font-weight: 750;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .availability-warning {
      margin-top: 0.65rem;
      color: #8a4b11;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.7rem;
    }

    .muted {
      color: #536873;
      font-size: 0.9rem;
    }

    .flash {
      padding: 0.7rem;
      border-radius: 8px;
      margin: 0.5rem 0;
      background: #e4f4ef;
    }

    .flash.error {
      background: #fbe9e6;
    }

    .progress-track {
      height: 0.55rem;
      margin: 0.5rem 0;
      overflow: hidden;
      border-radius: 5px;
      background: #e8edef;
    }

    .progress-fill {
      height: 100%;
      background: #176b73;
    }

    .criterion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid #edf1f2;
    }

    .criterion form {
      flex: 0 0 auto;
      margin: 0;
    }

    fieldset {
      border: 1px solid #e2e9eb;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      margin: 0 0 1.1rem;
    }

    legend {
      font-weight: 650;
      padding: 0 0.4rem;
    }

    .category-tools {
      margin: 0.25rem 0 0.7rem;
      border-radius: 7px;
      background: #f5f8f8;
    }

    .category-tools summary {
      padding: 0.55rem 0.7rem;
      color: #176b73;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 650;
    }

    .category-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.65rem;
      padding: 0 0.7rem 0.7rem;
    }

    .action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem;
    }

    .action-group-label {
      flex-basis: 100%;
      color: #536873;
      font-size: 0.78rem;
      font-weight: 650;
    }

    .category-actions button {
      min-height: 2.2rem;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
    }

    .note {
      border-left: 3px solid #8eafb2;
      padding: 0.4rem 0.7rem;
      margin: 0.7rem 0;
      background: #f5f8f8;
    }

    .warning-panel {
      border-color: #efd6b6;
      background: #fffaf3;
    }

    .warning-panel p:last-child {
      margin-bottom: 0;
    }

    @media (max-width: 700px) {
      body {
        padding: 0.75rem;
      }

      header {
        padding: 1rem;
      }

      section {
        padding: 1rem;
      }

      .course-form {
        grid-template-columns: 1fr;
      }

      input[type="text"],
      select {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1><a href="{{ url_for('index') }}">Sailing Progress Tracker</a></h1>
    <p>Track course groups and sailors against the sailing syllabus.</p>
  </header>

  {% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ category }}" role="status">{{ message }}</div>
  {% endfor %}

  {% block content %}{% endblock %}
</body>

</html>
